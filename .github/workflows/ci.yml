name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts functions
      - name: Format check
        run: ruff format --check src tests scripts functions
      - name: Type check
        run: mypy src
      - name: Unit tests
        run: pytest --cov=anschlussradar --cov-report=term-missing
      - name: KQL tables are generated, not edited by hand
        run: |
          python scripts/gen_kql_tables.py
          git diff --exit-code kql/01_tables.kql

  bicep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and lint Bicep
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
