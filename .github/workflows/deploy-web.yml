name: deploy-web

# Builds the web app and uploads it to Azure Static Web Apps.
# Switched on by the repository variable WEB_DEPLOY=true. Also needed: the variable
# API_BASE_URL and the secret SWA_DEPLOYMENT_TOKEN. The variable WEB_ACCESS decides who
# can open the app: "demo" (default, invited people only) or "public".

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.WEB_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
          WEB_ACCESS: ${{ vars.WEB_ACCESS }}
          VITE_WEB_ACCESS: ${{ vars.WEB_ACCESS }}
          SITE_URL: ${{ vars.SITE_URL }}   # e.g. https://anschlussradar.de, once the domain is live
        run: |
          npm install --no-audit --no-fund
          npm run build
          node scripts/access.mjs
      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: web/dist
          skip_app_build: true
